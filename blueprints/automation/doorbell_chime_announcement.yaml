blueprint:
  name: "Türklingel – Gong, Ansage & Kamera"
  description: >
    Spielt bei einem Klingeldruck optional einen Gong und/oder eine Sprachausgabe
    auf mehreren Lautsprechern oder Displays ab. Google/Nest, Amazon Alexa (Beta)
    und andere Lautsprecher (Beta) können gleichzeitig verwendet werden.
    Für Google/Nest kann zusätzlich ein Kamerastream angezeigt werden.
    Die Gong- und Ansagelautstärke kann jeweils optional angepasst und anschließend
    auf den vorherigen Wert zurückgestellt werden.
  domain: automation
  author: tojollinor
  source_url: https://github.com/tojollinor/HomeAssistant-Blueprints/blob/main/blueprints/automation/doorbell_chime_announcement.yaml
  homeassistant:
    min_version: 2024.6.0

  input:
    basic:
      name: "Auslöser"
      icon: mdi:doorbell-video
      input:
        doorbell_sensor:
          name: Klingelsensor
          description: Binary Sensor, der beim Klingeldruck auf "on" wechselt.
          selector:
            entity:
              filter:
                - domain: binary_sensor

    players:
      name: "Lautsprecher / Displays"
      icon: mdi:speaker-multiple
      description: >
        Alle gewünschten Zielgruppen können gleichzeitig befüllt werden.
        Leere Gruppen werden automatisch übersprungen.
      input:
        google_media_players:
          name: Google / Nest Hub
          description: Zeigt nur Media-Player der Google-Cast-Integration.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player
                  integration: cast

        alexa_media_players:
          name: Amazon Alexa (Beta)
          description: Zeigt nur Media-Player der Alexa-Media-Player-Integration.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player
                  integration: alexa_media

        other_media_players:
          name: Andere Lautsprecher (Beta)
          description: Allgemeine Media-Player-Auswahl für weitere Lautsprecher und Displays.
          default: []
          selector:
            entity:
              multiple: true
              reorder: true
              filter:
                - domain: media_player

    gong:
      name: Gong
      icon: mdi:bell-ring
      input:
        enable_gong:
          name: Gong abspielen
          default: true
          selector:
            boolean:

        adjust_gong_volume:
          name: Gong-Lautstärke anpassen
          description: Wenn deaktiviert, bleibt die aktuelle Lautstärke der Zielgeräte unverändert.
          default: true
          selector:
            boolean:

        gong_volume:
          name: Gong-Lautstärke
          description: Wird nur verwendet, wenn "Gong-Lautstärke anpassen" aktiviert ist.
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

        gong_wait:
          name: Pause nach dem Gong
          description: Zeit bis zur Sprachausgabe.
          default: 2.5
          selector:
            number:
              min: 0
              max: 15
              step: 0.5
              unit_of_measurement: s
              mode: slider

        gong_url:
          name: Gong-URL für Google / andere Lautsprecher
          description: HTTPS-Adresse der Audiodatei. Kann durch eine eigene Gong-Datei ersetzt werden.
          default: "https://upload.wikimedia.org/wikipedia/commons/9/90/Doorbell-cheap-dingdong.ogg"
          selector:
            text:

    speech:
      name: Sprachausgabe
      icon: mdi:account-voice
      input:
        enable_speech:
          name: Sprachausgabe verwenden
          default: true
          selector:
            boolean:

        tts_entity:
          name: TTS-Engine
          description: Für Google/Nest und andere Lautsprecher, z. B. Google Translate TTS.
          selector:
            entity:
              filter:
                - domain: tts

        announcement_text:
          name: Ansagetext
          default: "Jemand ist an der Hintertür."
          selector:
            text:
              multiline: false

        send_tts_language:
          name: Sprache an TTS übergeben
          description: >
            Wenn deaktiviert, wird kein language-Parameter an die TTS-Engine gesendet.
            Das ist für Engines sinnvoll, die ihre Sprache selbst konfigurieren.
          default: false
          selector:
            boolean:

        tts_language:
          name: TTS-Sprache
          description: Wird nur verwendet, wenn "Sprache an TTS übergeben" aktiviert ist, z. B. "de".
          default: "de"
          selector:
            text:

        adjust_speech_volume:
          name: Ansage-Lautstärke anpassen
          description: Wenn deaktiviert, bleibt die aktuelle Lautstärke der Zielgeräte unverändert.
          default: true
          selector:
            boolean:

        speech_volume:
          name: Ansage-Lautstärke
          description: Wird nur verwendet, wenn "Ansage-Lautstärke anpassen" aktiviert ist.
          default: 60
          selector:
            number:
              min: 10
              max: 100
              step: 5
              unit_of_measurement: "%"
              mode: slider

    camera:
      name: "Kamerabild auf Google / Nest Hub"
      icon: mdi:cctv
      description: >
        Optionaler Live-Stream nach Gong und Ansage. Die Kameraausgabe wird nur
        auf den ausgewählten Google / Nest Hubs verwendet.
      input:
        enable_camera:
          name: Kamerabild anzeigen
          default: false
          selector:
            boolean:

        camera_entities:
          name: Kamera
          description: Eine Kamera auswählen. Das Listenformat erlaubt, das Feld bei deaktivierter Kamera leer zu lassen.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                - domain: camera

        camera_duration:
          name: Kamera-Anzeigedauer
          description: Dauer, die der Kamerastream auf den Google/Nest Hubs sichtbar bleibt.
          default: 30
          selector:
            number:
              min: 5
              max: 180
              step: 5
              unit_of_measurement: s
              mode: slider

    cleanup:
      name: Abschluss
      icon: mdi:restore
      input:
        final_wait:
          name: Wartezeit ohne Kamerastream
          description: >
            Zeit nach Gong/Ansage bis zum Abschluss, wenn kein Google-Kamerastream läuft.
          default: 7
          selector:
            number:
              min: 0
              max: 30
              step: 1
              unit_of_measurement: s
              mode: slider

        restore_volume:
          name: Vorherige Lautstärke wiederherstellen
          description: >
            Stellt die vor dem Klingeln gespeicherte Lautstärke wieder her, sofern
            Gong- oder Ansage-Lautstärke angepasst wurde.
          default: true
          selector:
            boolean:

        close_google_cast:
          name: Google-Cast-Session schließen
          description: Wird nur für ausgewählte Google / Nest Hubs ausgeführt.
          default: true
          selector:
            boolean:

variables:
  google_media_players: !input google_media_players
  alexa_media_players: !input alexa_media_players
  other_media_players: !input other_media_players
  enable_gong: !input enable_gong
  adjust_gong_volume: !input adjust_gong_volume
  gong_volume: !input gong_volume
  gong_wait: !input gong_wait
  gong_url: !input gong_url
  enable_speech: !input enable_speech
  tts_entity: !input tts_entity
  announcement_text: !input announcement_text
  send_tts_language: !input send_tts_language
  tts_language: !input tts_language
  adjust_speech_volume: !input adjust_speech_volume
  speech_volume: !input speech_volume
  enable_camera: !input enable_camera
  camera_entities: !input camera_entities
  camera_duration: !input camera_duration
  final_wait: !input final_wait
  restore_volume: !input restore_volume
  close_google_cast: !input close_google_cast

  effective_other_players: >
    {% set ns = namespace(items=[]) %}
    {% for player in other_media_players %}
      {% if player not in google_media_players and player not in alexa_media_players %}
        {% set ns.items = ns.items + [player] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  target_players: >
    {% set ns = namespace(items=[]) %}
    {% for player in google_media_players + alexa_media_players + other_media_players %}
      {% if player not in ns.items %}
        {% set ns.items = ns.items + [player] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  camera_active: >
    {{ (enable_camera | bool)
       and (camera_entities | count > 0)
       and (google_media_players | count > 0) }}

  volume_was_adjusted: >
    {{ ((enable_gong | bool) and (adjust_gong_volume | bool))
       or ((enable_speech | bool) and (adjust_speech_volume | bool)) }}

  previous_volumes: >
    {% set ns = namespace(items=[]) %}
    {% for player in target_players %}
      {% set volume = state_attr(player, 'volume_level') %}
      {% set ns.items = ns.items + [[player, volume if volume is number else -1]] %}
    {% endfor %}
    {{ ns.items | to_json }}

triggers:
  - trigger: state
    entity_id: !input doorbell_sensor
    from: "off"
    to: "on"

conditions:
  - condition: template
    value_template: "{{ target_players | count > 0 }}"

actions:
  - parallel:
      - sequence:
          - if:
              - condition: template
                value_template: "{{ google_media_players | count > 0 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ (enable_gong | bool) and (adjust_gong_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: !input google_media_players
                    data:
                      volume_level: "{{ (gong_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_gong | bool }}"
                then:
                  - action: media_player.play_media
                    continue_on_error: true
                    target:
                      entity_id: !input google_media_players
                    data:
                      media_content_id: "{{ gong_url }}"
                      media_content_type: "audio/ogg"
                  - delay:
                      seconds: "{{ gong_wait | float(2.5) }}"

              - if:
                  - condition: template
                    value_template: "{{ (enable_speech | bool) and (adjust_speech_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: !input google_media_players
                    data:
                      volume_level: "{{ (speech_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_speech | bool }}"
                then:
                  - repeat:
                      for_each: "{{ google_media_players }}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ send_tts_language | bool }}"
                          then:
                            - action: tts.speak
                              continue_on_error: true
                              target:
                                entity_id: "{{ tts_entity }}"
                              data:
                                media_player_entity_id: "{{ repeat.item }}"
                                message: "{{ announcement_text }}"
                                language: "{{ tts_language }}"
                          else:
                            - action: tts.speak
                              continue_on_error: true
                              target:
                                entity_id: "{{ tts_entity }}"
                              data:
                                media_player_entity_id: "{{ repeat.item }}"
                                message: "{{ announcement_text }}"

              - if:
                  - condition: template
                    value_template: "{{ camera_active | bool }}"
                then:
                  - repeat:
                      for_each: "{{ google_media_players }}"
                      sequence:
                        - action: camera.play_stream
                          continue_on_error: true
                          target:
                            entity_id: "{{ camera_entities[0] }}"
                          data:
                            media_player: "{{ repeat.item }}"

      - sequence:
          - if:
              - condition: template
                value_template: "{{ alexa_media_players | count > 0 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ (enable_gong | bool) and (adjust_gong_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: !input alexa_media_players
                    data:
                      volume_level: "{{ (gong_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_gong | bool }}"
                then:
                  - action: notify.alexa_media
                    continue_on_error: true
                    data:
                      target: !input alexa_media_players
                      message: >-
                        <speak><audio src="soundbank://soundlibrary/home/amzn_sfx_doorbell_chime_01"/></speak>
                      data:
                        type: announce
                        method: all
                  - delay:
                      seconds: "{{ gong_wait | float(2.5) }}"

              - if:
                  - condition: template
                    value_template: "{{ (enable_speech | bool) and (adjust_speech_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: !input alexa_media_players
                    data:
                      volume_level: "{{ (speech_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_speech | bool }}"
                then:
                  - action: notify.alexa_media
                    continue_on_error: true
                    data:
                      target: !input alexa_media_players
                      message: "{{ announcement_text }}"
                      data:
                        type: announce
                        method: all

      - sequence:
          - if:
              - condition: template
                value_template: "{{ effective_other_players | count > 0 }}"
            then:
              - if:
                  - condition: template
                    value_template: "{{ (enable_gong | bool) and (adjust_gong_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: "{{ effective_other_players }}"
                    data:
                      volume_level: "{{ (gong_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_gong | bool }}"
                then:
                  - action: media_player.play_media
                    continue_on_error: true
                    target:
                      entity_id: "{{ effective_other_players }}"
                    data:
                      media_content_id: "{{ gong_url }}"
                      media_content_type: "audio/ogg"
                  - delay:
                      seconds: "{{ gong_wait | float(2.5) }}"

              - if:
                  - condition: template
                    value_template: "{{ (enable_speech | bool) and (adjust_speech_volume | bool) }}"
                then:
                  - action: media_player.volume_set
                    continue_on_error: true
                    target:
                      entity_id: "{{ effective_other_players }}"
                    data:
                      volume_level: "{{ (speech_volume | float(60) / 100) | round(2) }}"
                  - delay:
                      milliseconds: 300

              - if:
                  - condition: template
                    value_template: "{{ enable_speech | bool }}"
                then:
                  - repeat:
                      for_each: "{{ effective_other_players }}"
                      sequence:
                        - if:
                            - condition: template
                              value_template: "{{ send_tts_language | bool }}"
                          then:
                            - action: tts.speak
                              continue_on_error: true
                              target:
                                entity_id: "{{ tts_entity }}"
                              data:
                                media_player_entity_id: "{{ repeat.item }}"
                                message: "{{ announcement_text }}"
                                language: "{{ tts_language }}"
                          else:
                            - action: tts.speak
                              continue_on_error: true
                              target:
                                entity_id: "{{ tts_entity }}"
                              data:
                                media_player_entity_id: "{{ repeat.item }}"
                                message: "{{ announcement_text }}"

  - delay:
      seconds: >
        {% if camera_active | bool %}
          {{ camera_duration | float(30) }}
        {% else %}
          {{ final_wait | float(7) }}
        {% endif %}

  - if:
      - condition: template
        value_template: "{{ (restore_volume | bool) and (volume_was_adjusted | bool) }}"
    then:
      - repeat:
          for_each: "{{ previous_volumes | from_json }}"
          sequence:
            - if:
                - condition: template
                  value_template: "{{ repeat.item[1] | float(-1) >= 0 }}"
              then:
                - action: media_player.volume_set
                  continue_on_error: true
                  target:
                    entity_id: "{{ repeat.item[0] }}"
                  data:
                    volume_level: "{{ repeat.item[1] | float }}"

  - delay:
      milliseconds: 500

  - if:
      - condition: template
        value_template: "{{ (google_media_players | count > 0) and (close_google_cast | bool) }}"
    then:
      - action: media_player.turn_off
        continue_on_error: true
        target:
          entity_id: !input google_media_players

mode: queued
max: 3
max_exceeded: silent
